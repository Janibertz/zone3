<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zone3</title>
<style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
    p { font-size: 17px; line-height: 1.4; margin: 0 0 24px; }
    a { display: inline-block; background: #0071e3; color: #fff; text-decoration: none; font-weight: 600;
        padding: 14px 28px; border-radius: 14px; font-size: 17px; }
</style>
</head>
<body>
    <!-- Lädt die App zone3.run nicht, zeigt Capacitor diese Seite (server.errorPath).
         Ohne sie stand auf Android die Fehlerseite der WebView mit schwarzer
         Schrift auf dem schwarzen App-Hintergrund: nur ein Symbol oben links. -->
    <p>Zone3 lässt sich gerade nicht laden.<br>Prüfe die Internetverbindung.</p>
    <a href="https://zone3.run/dashboard">Erneut versuchen</a>
    <small id="code" style="margin-top:28px;color:#8e8e93;font-size:13px;word-break:break-all"></small>
    <script>
        var q = new URLSearchParams(location.search);
        if (q.get('code')) {
            document.getElementById('code').textContent = q.get('code') + ' · ' + (q.get('url') || '');
        }
    </script>
</body>
</html>
