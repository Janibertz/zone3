name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Zweck: die Testsuite und der Frontend-Build sollen nicht unbemerkt
# kaputtgehen. Beides lief bisher nur lokal und von Hand — mehrere Fehler
# dieser Woche wären hier aufgefallen, bevor sie auf der Produktion landeten.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Die Suite läuft gegen SQLite im Arbeitsspeicher (siehe phpunit.xml).
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Vor composer install: dessen post-autoload-dump startet
      # `artisan package:discover`, und das bootet Laravel.
      - name: Umgebung vorbereiten
        run: cp .env.example .env

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Anwendungsschlüssel erzeugen
        run: php artisan key:generate --force

      - name: Tests
        run: php artisan test

  build:
    name: Build (Frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vue-Bindings prüfen
        # Findet Bezeichner, die im Template stehen, aber im Script fehlen —
        # genau der Fehler, der beim Umbau des Dashboards einmal durchrutschte.
        run: node scripts/check-bindings.mjs
