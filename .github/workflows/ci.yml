name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
#
# Bewusst EIN Job statt zwei paralleler: die Schritte hängen voneinander ab.
# Der Frontend-Build importiert Ziggy aus vendor/ (also aus einem PHP-Paket),
# und die Testsuite rendert Inertia-Seiten — dafür muss das Vite-Manifest
# unter public/build liegen, das nicht im Repository ist. Zwei getrennte Jobs
# waren beide rot, jeder aus dem Grund, den der andere gelöst hätte.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Tests und Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Die Suite läuft gegen SQLite im Arbeitsspeicher (siehe phpunit.xml).
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Vor composer install: dessen post-autoload-dump startet
      # `artisan package:discover`, und das bootet Laravel.
      - name: Umgebung vorbereiten
        run: cp .env.example .env

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: PHP-Abhängigkeiten
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Anwendungsschlüssel
        run: php artisan key:generate --force

      - name: JS-Abhängigkeiten
        run: npm ci

      # Muss vor den Tests laufen: ohne public/build/manifest.json wirft die
      # @vite-Direktive, und jede Inertia-Antwort wird zur Fehlerseite.
      - name: Build
        run: npm run build

      - name: Vue-Bindings prüfen
        # Findet Bezeichner, die im Template stehen, aber im Script fehlen —
        # Vue meldet das nicht beim Bauen, der Fehler kommt erst im Browser.
        run: node scripts/check-bindings.mjs

      - name: Tests
        run: php artisan test
