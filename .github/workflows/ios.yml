name: iOS

# Baut die Capacitor-Hülle (ios/) auf einem macOS-Runner — Zone3 hat keinen
# eigenen Mac, also ist das hier die einzige Stelle, an der Xcode läuft.
#
# Die App lädt zone3.run (capacitor.config.json → server.url). Eine Änderung
# an Vue oder Laravel braucht deshalb KEINEN neuen Build; nur was unter ios/
# oder an den Capacitor-Paketen ändert, löst diesen Lauf aus. macOS-Minuten
# zählen in privaten Repositories zehnfach, darum kein Lauf bei jedem Push.
#
# Stufe 1: Simulator-Build ohne Signatur — beweist, dass das Projekt baut.
# Stufe 2 (Job testflight) signiert und lädt hoch, nur per Hand gestartet.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Signieren und zu TestFlight hochladen'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator-Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Capacitor synchronisieren
        run: npx cap sync ios

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Bauen
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Stufe 2: signieren und zu TestFlight hochladen — nur per Hand
  # (Actions → iOS → Run workflow, „testflight" anhaken).
  #
  # Ohne Mac gibt es keinen Schlüsselbund mit Zertifikat. Xcode holt sich
  # Zertifikat und Profil deshalb selbst über den App-Store-Connect-API-
  # Schlüssel (-allowProvisioningUpdates, „cloud-managed signing"). Dafür
  # braucht der Schlüssel die Rolle Admin; App Manager darf keine
  # Zertifikate anlegen.
  #
  # Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Inhalt der .p8-Datei),
  # APPLE_TEAM_ID. Die App muss in App Store Connect einmal von Hand angelegt
  # sein (Name Zone3, Bundle-ID run.zone3.app), sonst lehnt der Upload ab.
  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Capacitor synchronisieren
        run: npx cap sync ios

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"

      - name: Archiv bauen
        # Ad-hoc signiert („-"), ohne Profil: automatisches Signieren will
        # beim Archivieren ein Entwickler-Profil, und das gibt es nur mit
        # registriertem Gerät („Your team has no devices"). Richtig signiert
        # wird erst beim Export, mit Distributionszertifikat und
        # App-Store-Profil. Ganz unsigniert (CODE_SIGNING_ALLOWED=NO) ging
        # auch, verlor aber die Berechtigungen aus App.entitlements — der
        # Export übernimmt nur, was im Archiv signiert steht, und ohne
        # aps-environment kommt kein Push an.
        # Die Build-Nummer muss bei jedem Upload steigen; die Laufnummer tut das.
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Zone3.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            archive

      - name: Berechtigungen im Archiv
        run: codesign -d --entitlements - --xml "$RUNNER_TEMP"/Zone3.xcarchive/Products/Applications/*.app | plutil -p - || true

      - name: Exportieren und hochladen
        # Zuerst als IPA exportieren und prüfen, dass die Push-Berechtigung
        # (aps-environment) mitsigniert wurde — das Archiv ist unsigniert,
        # die Berechtigung kommt erst beim Export dazu. Ohne sie meldet iOS
        # beim Registrieren nur „no valid aps-environment“ und es kommt nie
        # ein Push an. Danach derselbe Export mit Upload.
        run: |
          write_options() {
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>$1</string>
              <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          }
          export_archive() {
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Zone3.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/$1" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          }

          write_options export
          export_archive ipa
          mkdir -p "$RUNNER_TEMP/ipa/unzipped"
          unzip -q "$RUNNER_TEMP"/ipa/*.ipa -d "$RUNNER_TEMP/ipa/unzipped"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/ipa/unzipped/Payload/*.app > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          if ! grep -q "aps-environment" "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::Push-Berechtigung (aps-environment) fehlt im signierten Build"
            exit 1
          fi
          # Universal Links: ohne associated-domains öffnen die Rückwege von
          # Garmin, COROS und Strava weiter Safari statt der App.
          if ! grep -q "applinks:zone3.run" "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::Universal Links (associated-domains) fehlen im signierten Build"
            exit 1
          fi
          # Mit Apple anmelden: ohne die Berechtigung meldet das Sheet Fehler 1000.
          if ! grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::Sign in with Apple (com.apple.developer.applesignin) fehlt im signierten Build"
            exit 1
          fi
          # Apple Health: ohne die Berechtigung bricht requestAuthorization ab.
          if ! grep -q "com.apple.developer.healthkit" "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::HealthKit-Berechtigung fehlt im signierten Build"
            exit 1
          fi

          # Widget: die Erweiterung muss mit, und beide Teile brauchen die
          # geteilte Schlüsselbund-Gruppe, sonst findet das Widget seinen Zugang nicht.
          if [ ! -d "$RUNNER_TEMP"/ipa/unzipped/Payload/*.app/PlugIns/Zone3Widget.appex ]; then
            echo "::error::Widget-Erweiterung (Zone3Widget.appex) fehlt im Build"
            exit 1
          fi
          if ! grep -q "run.zone3.shared" "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::Schlüsselbund-Gruppe run.zone3.shared fehlt in der App"
            exit 1
          fi
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/ipa/unzipped/Payload/*.app/PlugIns/Zone3Widget.appex > "$RUNNER_TEMP/widget-entitlements.plist"
          plutil -p "$RUNNER_TEMP/widget-entitlements.plist"
          if ! grep -q "run.zone3.shared" "$RUNNER_TEMP/widget-entitlements.plist"; then
            echo "::error::Schlüsselbund-Gruppe run.zone3.shared fehlt im Widget"
            exit 1
          fi

          write_options upload
          export_archive export

      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
