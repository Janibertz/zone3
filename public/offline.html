<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Zone3 – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 1.5rem; display: block; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #aeaeb2; margin-bottom: 2rem; }
    button {
      background: #0a84ff; color: white;
      border: none; border-radius: 999px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <!-- Das Zeichen inline: offline laedt keine zweite Datei. -->
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#1c1c1e"/><g transform="translate(50 50) scale(0.88) translate(-54.5 -50.5)"><path d="M33 22 H48 A13.5 13.5 0 0 1 48 49 A15 15 0 0 1 48 79 H34" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="78" r="6.5" fill="#0a84ff"/></g></svg>
  <h1>Du bist offline</h1>
  <p>Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
  <button onclick="location.reload()">Erneut versuchen</button>
</body>
</html>
